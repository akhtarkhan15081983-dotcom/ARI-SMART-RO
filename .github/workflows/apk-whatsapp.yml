name: ARI SMART RO WhatsApp APK

permissions:
  contents: read

concurrency:
  group: android-whatsapp-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - "ari_smart_ro_app/**"
      - ".github/workflows/apk-whatsapp.yml"

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ari_smart_ro_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get

      - name: Analyze Flutter code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build WhatsApp-friendly split APKs
        run: >-
          flutter build apk --debug --split-per-abi
          --dart-define=API_BASE_URL=https://ari-smart-ro-api.onrender.com/api

      - name: Rename phone APKs
        shell: bash
        run: |
          cd build/app/outputs/flutter-apk
          cp app-arm64-v8a-debug.apk ARI-SMART-RO-v1.0.17-WhatsApp-ARM64.apk
          cp app-armeabi-v7a-debug.apk ARI-SMART-RO-v1.0.17-WhatsApp-ARMv7.apk

      - name: Upload WhatsApp APKs
        uses: actions/upload-artifact@v4
        with:
          name: ARI-SMART-RO-v1.0.17-WhatsApp-APKs
          path: |
            ari_smart_ro_app/build/app/outputs/flutter-apk/ARI-SMART-RO-v1.0.17-WhatsApp-ARM64.apk
            ari_smart_ro_app/build/app/outputs/flutter-apk/ARI-SMART-RO-v1.0.17-WhatsApp-ARMv7.apk
          if-no-files-found: error
          retention-days: 30
