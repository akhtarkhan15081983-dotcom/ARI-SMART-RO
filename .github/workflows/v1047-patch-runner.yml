name: v1.0.47 Patch Runner

on:
  push:
    branches:
      - fix/device-migration-customer-scroll-v1.0.47-2026-09-28

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[v1047-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/device-migration-customer-scroll-v1.0.47-2026-09-28
          fetch-depth: 0
      - name: Apply v1.0.47 patch
        run: python tools/apply_v1047_patch.py
      - name: Commit patched release candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: v1.0.47 launch reliability [v1047-applied]"
          git push origin HEAD:fix/device-migration-customer-scroll-v1.0.47-2026-09-28
