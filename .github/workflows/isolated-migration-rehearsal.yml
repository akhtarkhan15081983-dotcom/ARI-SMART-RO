name: Isolated Tenant Migration Rehearsal

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type REHEARSE_ISOLATED_DB_ONLY to allow rehearsal DB migrations'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: isolated-tenant-migration-rehearsal
  cancel-in-progress: false

jobs:
  rehearse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DJANGO_DEBUG: '1'
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: ${{ secrets.REHEARSAL_DB_NAME }}
      DB_USER: ${{ secrets.REHEARSAL_DB_USER }}
      DB_PASSWORD: ${{ secrets.REHEARSAL_DB_PASSWORD }}
      DB_HOST: ${{ secrets.REHEARSAL_DB_HOST }}
      DB_PORT: ${{ secrets.REHEARSAL_DB_PORT }}

    steps:
      - name: Guard explicit rehearsal confirmation
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.confirm }}" != "REHEARSE_ISOLATED_DB_ONLY" ]; then
            echo "Explicit rehearsal confirmation is missing."
            exit 1
          fi
          if [ -z "${DB_NAME:-}" ]; then
            echo "REHEARSAL_DB_NAME secret is not configured."
            exit 1
          fi
          if [ "${GITHUB_REF_NAME}" != "hardening/max-pro-5of5-2026-09-29" ]; then
            echo "Refusing to run outside the approved hardening branch."
            exit 1
          fi
          if [ "$DB_NAME" = "ari_smart_ro" ]; then
            echo "Refusing to run against the production database."
            exit 1
          fi
          if [ "$DB_NAME" != "ari_smart_ro_szws" ]; then
            echo "Refusing to run against any database except the approved isolated rehearsal database."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Verify connected database identity
        working-directory: backend
        run: |
          python manage.py shell -c "from django.db import connection; print('DB_ENGINE=', connection.vendor); print('DB_NAME=', connection.settings_dict.get('NAME'))"

      - name: Capture pre-migration evidence
        working-directory: backend
        run: |
          python manage.py shell -c "import json; from pathlib import Path; from assets.models import ROAsset; from customers.models import PublicCustomerRequest, Customer; data={'roasset_rows': ROAsset.objects.count(), 'roasset_linked': ROAsset.objects.filter(current_customer__isnull=False).count(), 'roasset_unassigned': ROAsset.objects.filter(current_customer__isnull=True).count(), 'public_request_rows': PublicCustomerRequest.objects.count(), 'customer_rows': Customer.objects.count(), 'customers_with_company': Customer.objects.filter(company__isnull=False).count(), 'customers_without_company': Customer.objects.filter(company__isnull=True).count()}; Path('/tmp/rehearsal_before.json').write_text(json.dumps(data), encoding='utf-8'); print(json.dumps(data, indent=2))"

      - name: Show migration plan
        working-directory: backend
        run: python manage.py migrate --plan

      - name: Apply migrations to isolated rehearsal database
        working-directory: backend
        run: python manage.py migrate --noinput

      - name: Verify migration rows and schema-visible model fields
        working-directory: backend
        run: |
          python manage.py shell -c "from django.db import connection; from django.db.migrations.recorder import MigrationRecorder; from assets.models import ROAsset; from customers.models import PublicCustomerRequest; applied=set(MigrationRecorder(connection).migration_qs.values_list('app','name')); assert ('assets','0004_roasset_company') in applied; assert ('customers','0022_publiccustomerrequest_company') in applied; assert ROAsset._meta.get_field('company'); assert PublicCustomerRequest._meta.get_field('company'); print('MIGRATION_ROWS_OK=1'); print('ROASSET_COMPANY_FIELD_OK=1'); print('PUBLIC_REQUEST_COMPANY_FIELD_OK=1')"

      - name: Capture and verify post-migration evidence
        working-directory: backend
        run: |
          python manage.py shell -c "import json; from pathlib import Path; from assets.models import ROAsset; from customers.models import PublicCustomerRequest; before=json.loads(Path('/tmp/rehearsal_before.json').read_text(encoding='utf-8')); after={'roasset_rows': ROAsset.objects.count(), 'roasset_with_company': ROAsset.objects.filter(company__isnull=False).count(), 'roasset_without_company': ROAsset.objects.filter(company__isnull=True).count(), 'public_request_rows': PublicCustomerRequest.objects.count(), 'public_requests_with_company': PublicCustomerRequest.objects.filter(company__isnull=False).count(), 'public_requests_without_company': PublicCustomerRequest.objects.filter(company__isnull=True).count()}; assert after['roasset_rows'] == before['roasset_rows'], f\"ROAsset row count changed: {before['roasset_rows']} -> {after['roasset_rows']}\"; assert after['public_request_rows'] == before['public_request_rows'], f\"PublicCustomerRequest row count changed: {before['public_request_rows']} -> {after['public_request_rows']}\"; print(json.dumps(after, indent=2))"

      - name: Read-only tenant migration rehearsal
        working-directory: backend
        run: python manage.py rehearse_tenant_migration

      - name: Tenant ownership dry-run
        working-directory: backend
        run: python manage.py backfill_tenant_ownership

      - name: Inventory ownership dry-run
        working-directory: backend
        run: python manage.py backfill_inventory_tenant_ownership

      - name: Duplicate supplier invoice audit
        working-directory: backend
        run: python manage.py audit_duplicate_supplier_invoices --fail-on-conflict --json /tmp/duplicate-invoice-audit.json
