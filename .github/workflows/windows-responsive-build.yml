name: ARI SMART RO Windows Responsive Build

permissions:
  contents: read

on:
  push:
    branches: [fix/windows-responsive-pointer-2026-09-27]
  workflow_dispatch:

jobs:
  windows-responsive:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ari_smart_ro_app
    env:
      WINDOWS_CODESIGN_PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}
      WINDOWS_CODESIGN_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Apply responsive Windows UI patch
        working-directory: .
        run: python scripts/apply_windows_responsive_patch.py

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Resolve Windows package version
        shell: pwsh
        run: |
          $line = (Select-String -Path "pubspec.yaml" -Pattern "^version:").Line
          if (-not $line) { throw "pubspec version not found" }
          $raw = ($line -split '\s+')[1]
          $parts = $raw -split '\+'
          if ($parts.Count -ne 2) { throw "pubspec version must include +build" }
          "ARI_APP_VERSION=$($parts[0])" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ARI_APP_BUILD=$($parts[1])" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Analyze patched Flutter app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build Windows release
        run: >-
          flutter build windows --release
          --dart-define=API_BASE_URL=https://ari-smart-ro-api.onrender.com/api

      - name: Smoke test Windows app startup
        shell: pwsh
        run: |
          $exe = Resolve-Path "build\windows\x64\runner\Release\ARI_SMART_RO.exe"
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          if ($process.HasExited) {
            throw "ARI_SMART_RO.exe exited during startup smoke test with code $($process.ExitCode)."
          }
          Stop-Process -Id $process.Id -Force

      - name: Install trusted code-signing certificate
        if: ${{ env.WINDOWS_CODESIGN_PFX_BASE64 != '' }}
        shell: pwsh
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP "ari-smart-ro-codesign.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CODESIGN_PFX_BASE64))
          "ARI_CODESIGN_PFX=$pfxPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Sign Windows application binaries
        if: ${{ env.WINDOWS_CODESIGN_PFX_BASE64 != '' }}
        shell: pwsh
        run: |
          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Filter signtool.exe -Recurse |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1).FullName
          if (-not $signtool) { throw "signtool.exe not found" }
          $release = "build\windows\x64\runner\Release"
          $targets = Get-ChildItem $release -Recurse -File | Where-Object { $_.Extension -in ".exe", ".dll" }
          foreach ($target in $targets) {
            & $signtool sign /fd SHA256 /td SHA256 /tr "http://timestamp.digicert.com" /f $env:ARI_CODESIGN_PFX /p $env:WINDOWS_CODESIGN_PASSWORD $target.FullName
            if ($LASTEXITCODE -ne 0) { throw "Signing failed: $($target.FullName)" }
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Setup.exe installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "Inno Setup compiler not found." }
          & $iscc "/DMyAppVersion=$env:ARI_APP_VERSION" "/DMyAppBuild=$env:ARI_APP_BUILD" "installer\ari_smart_ro.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed." }

      - name: Sign Setup.exe installer
        if: ${{ env.WINDOWS_CODESIGN_PFX_BASE64 != '' }}
        shell: pwsh
        run: |
          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Filter signtool.exe -Recurse |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1).FullName
          if (-not $signtool) { throw "signtool.exe not found" }
          $setup = "build\windows\installer\ARI-SMART-RO-Setup-v$env:ARI_APP_VERSION.exe"
          & $signtool sign /fd SHA256 /td SHA256 /tr "http://timestamp.digicert.com" /f $env:ARI_CODESIGN_PFX /p $env:WINDOWS_CODESIGN_PASSWORD $setup
          if ($LASTEXITCODE -ne 0) { throw "Installer signing failed." }

      - name: Prepare portable Windows package
        shell: pwsh
        run: |
          $release = "build\windows\x64\runner\Release"
          $package = "build\windows\ARI-SMART-RO-Windows-v$env:ARI_APP_VERSION"
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Copy-Item "$release\*" $package -Recurse -Force
          Compress-Archive -Path "$package\*" -DestinationPath "build\windows\ARI-SMART-RO-Windows-v$env:ARI_APP_VERSION.zip" -Force
          if ($env:WINDOWS_CODESIGN_PFX_BASE64) {
            "SIGNED_WITH_TRUSTED_CERTIFICATE=true" | Out-File "build\windows\SIGNING_STATUS.txt" -Encoding utf8
          } else {
            "SIGNED_WITH_TRUSTED_CERTIFICATE=false" | Out-File "build\windows\SIGNING_STATUS.txt" -Encoding utf8
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: ARI-SMART-RO-Setup-v${{ env.ARI_APP_VERSION }}
          path: |
            ari_smart_ro_app/build/windows/installer/ARI-SMART-RO-Setup-v${{ env.ARI_APP_VERSION }}.exe
            ari_smart_ro_app/build/windows/SIGNING_STATUS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload portable Windows app
        uses: actions/upload-artifact@v4
        with:
          name: ARI-SMART-RO-Windows-v${{ env.ARI_APP_VERSION }}
          path: ari_smart_ro_app/build/windows/ARI-SMART-RO-Windows-v${{ env.ARI_APP_VERSION }}.zip
          if-no-files-found: error
          retention-days: 30
