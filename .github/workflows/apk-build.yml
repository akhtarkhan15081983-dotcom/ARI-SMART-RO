name: ARI SMART RO APK

on:
  push:
    branches: [main]
    paths:
      - "ari_smart_ro_app/**"
      - ".github/workflows/apk-build.yml"

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ari_smart_ro_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build latest installable APK
        run: >-
          flutter build apk --release
          --dart-define=API_BASE_URL=https://ari-smart-ro-api.onrender.com/api
      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/ARI-SMART-RO-v1.0.2.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ARI-SMART-RO-v1.0.2-APK
          path: ari_smart_ro_app/build/app/outputs/flutter-apk/ARI-SMART-RO-v1.0.2.apk
          if-no-files-found: error
          retention-days: 30
