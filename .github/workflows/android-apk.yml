name: Build ARI SMART RO APK

on:
  push:
    branches: [andy-assistant]
  workflow_dispatch:

jobs:
  android-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ari_smart_ro_app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get Flutter packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Build production APK
        run: >-
          flutter build apk --release
          --dart-define=API_BASE_URL=https://ari-smart-ro-api.onrender.com/api

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/ARI-SMART-RO-v1.0.1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ARI-SMART-RO-v1.0.1-APK
          path: ari_smart_ro_app/build/app/outputs/flutter-apk/ARI-SMART-RO-v1.0.1.apk
          if-no-files-found: error
          retention-days: 30
