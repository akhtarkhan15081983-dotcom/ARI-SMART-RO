name: ARI SMART RO Production Android Release

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
    branches:
      - "andy-assistant"
    paths:
      - "ari_smart_ro_app/pubspec.yaml"

jobs:
  signed-android-release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: ari_smart_ro_app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Require production signing secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          missing=0
          for value in "$KEYSTORE_BASE64" "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS"; do
            if [ -z "$value" ]; then
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Production Android signing secrets are incomplete." >&2
            exit 1
          fi

      - name: Resolve and validate app version
        id: version
        shell: bash
        run: |
          VERSION="$(awk '/^version:/ {print $2}' pubspec.yaml | cut -d+ -f1)"
          BUILD="$(awk '/^version:/ {print $2}' pubspec.yaml | cut -d+ -f2)"
          if [ -z "$VERSION" ] || [ -z "$BUILD" ]; then
            echo "Unable to resolve version/build from pubspec.yaml" >&2
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME#v}"
            if [ "$TAG" != "$VERSION" ]; then
              echo "Tag v$TAG does not match pubspec version $VERSION" >&2
              exit 1
            fi
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"

      - name: Configure release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=../upload-keystore.jks\n' \
            "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
          test -s android/upload-keystore.jks
          test -s android/key.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Build signed release APK
        run: >-
          flutter build apk --release
          --dart-define=API_BASE_URL=https://ari-smart-ro-api.onrender.com/api

      - name: Build signed release AAB
        run: >-
          flutter build appbundle --release
          --dart-define=API_BASE_URL=https://ari-smart-ro-api.onrender.com/api

      - name: Verify APK signature
        shell: bash
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          if [ -z "$APKSIGNER" ]; then
            echo "apksigner not found" >&2
            exit 1
          fi
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Prepare immutable release artifacts
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
        run: |
          OUT="build/verified-release"
          mkdir -p "$OUT"
          cp build/app/outputs/flutter-apk/app-release.apk "$OUT/ARI-SMART-RO-v$VERSION+$BUILD.apk"
          cp build/app/outputs/bundle/release/app-release.aab "$OUT/ARI-SMART-RO-v$VERSION+$BUILD.aab"
          (
            cd "$OUT"
            sha256sum *.apk *.aab > SHA256SUMS.txt
          )
          cat "$OUT/SHA256SUMS.txt"

      - name: Upload verified signed release
        uses: actions/upload-artifact@v4
        with:
          name: ARI-SMART-RO-v${{ steps.version.outputs.version }}-signed-production
          path: ari_smart_ro_app/build/verified-release/
          if-no-files-found: error
          retention-days: 90
