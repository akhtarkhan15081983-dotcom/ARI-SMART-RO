name: ARI SMART RO CI

on:
  pull_request:
    branches: [main, andy-assistant, production-launch]
  push:
    branches: [andy-assistant, production-launch]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ari_ci
          POSTGRES_USER: ari_ci
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ari_ci -d ari_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_NAME: ari_ci
      DB_USER: ari_ci
      DB_PASSWORD: ci-only-password
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Django deployment checks
        env:
          DJANGO_DEBUG: "0"
          DJANGO_SECRET_KEY: "ci-only-secret-key-not-used-in-production"
          DJANGO_ALLOWED_HOSTS: "testserver,localhost"
          DJANGO_SECURE_SSL_REDIRECT: "0"
          DJANGO_MEDIA_STORAGE_BACKEND: "filesystem"
          DJANGO_MEDIA_ROOT: "/tmp/ari-smart-ro-ci-media"
          OTP_SMS_BACKEND: "webhook"
          OTP_SMS_WEBHOOK_URL: "https://example.invalid/otp"
        run: |
          python manage.py check --deploy
          python manage.py makemigrations --check --dry-run
      - name: Backend tests
        env:
          DJANGO_DISABLE_AUTH_THROTTLING: "1"
        run: python manage.py test -v 1

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ari_smart_ro_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
      - name: Compile release Android App Bundle
        run: >-
          flutter build appbundle --release
          --dart-define=API_BASE_URL=https://api.example.invalid/api

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production container
        run: docker build -t ari-smart-ro:${{ github.sha }} .
