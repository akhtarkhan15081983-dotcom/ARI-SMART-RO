name: Referral CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [referral-ui-integration]

jobs:
  backend-referrals:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: >-
          pip install
          "Django==6.0.7"
          djangorestframework
          djangorestframework-simplejwt
          django-cors-headers
          django-extensions
          Pillow
          "qrcode[pil]"
          openpyxl
          reportlab
      - run: python manage.py test referrals

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ari_smart_ro_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
