name: ARI SMART RO CI

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main, andy-assistant, production-launch]
  push:
    branches: [main, andy-assistant, production-launch]

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ari_ci
          POSTGRES_USER: ari_ci
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ari_ci -d ari_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_NAME: ari_ci
      DB_USER: ari_ci
      DB_PASSWORD: ci-only-password
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      ARI_SKIP_EXACT_EXCEL_IMPORT_FOR_TESTS: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Django deployment checks
        env:
          DJANGO_DEBUG: "0"
          DJANGO_SECRET_KEY: "ci-only-secret-key-not-used-in-production"
          DJANGO_ALLOWED_HOSTS: "testserver,localhost"
          DJANGO_SECURE_SSL_REDIRECT: "0"
          DJANGO_MEDIA_STORAGE_BACKEND: "filesystem"
          DJANGO_MEDIA_ROOT: "/tmp/ari-smart-ro-ci-media"
          OTP_SMS_BACKEND: "webhook"
          OTP_SMS_WEBHOOK_URL: "https://example.invalid/otp"
        run: |
          python manage.py check --deploy
          python manage.py makemigrations --check --dry-run
      - name: Backend tests
        env:
          DJANGO_DISABLE_AUTH_THROTTLING: "1"
        run: python manage.py test -v 1 --keepdb

  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ari_smart_ro_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
      - name: Compile Android debug APK
        run: >-
          flutter build apk --debug
          --dart-define=API_BASE_URL=https://ari-smart-ro-api.onrender.com/api
      - name: Prepare shareable APK
        run: cp build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/ARI-SMART-RO-v1.0.27-latest.apk
      - name: Upload latest Android APK
        uses: actions/upload-artifact@v4
        with:
          name: ARI-SMART-RO-v1.0.27-latest
          path: ari_smart_ro_app/build/app/outputs/flutter-apk/ARI-SMART-RO-v1.0.27-latest.apk
          if-no-files-found: error
          retention-days: 30

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build production container
        run: docker build -t ari-smart-ro:${{ github.sha }} .


  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: ari_smart_ro_app
    env:
      WINDOWS_CODESIGN_PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}
      WINDOWS_CODESIGN_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Build Windows release
        run: >-
          flutter build windows --release
          --dart-define=API_BASE_URL=https://ari-smart-ro-api.onrender.com/api

      - name: Verify Windows Safe Build
        shell: pwsh
        run: |
          $release = "build\windows\x64\runner\Release"
          $blockedPatterns = @(
            "*file_selector*",
            "*flutter_secure_storage*",
            "*geolocator*",
            "*permission_handler*",
            "*record_windows*",
            "*url_launcher*",
            "*local_notifications*",
            "dartjni.dll"
          )
          foreach ($pattern in $blockedPatterns) {
            $found = Get-ChildItem $release -Filter $pattern -ErrorAction SilentlyContinue
            if ($found) {
              throw "Unsafe native plugin present in Windows Safe Build: $($found.Name -join ', ')"
            }
          }
          Write-Host "Windows Safe Build contains no third-party plugin DLLs."

      - name: Install trusted code-signing certificate
        if: ${{ env.WINDOWS_CODESIGN_PFX_BASE64 != '' }}
        shell: pwsh
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP "ari-smart-ro-codesign.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CODESIGN_PFX_BASE64))
          "ARI_CODESIGN_PFX=$pfxPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Sign Windows application binaries
        if: ${{ env.WINDOWS_CODESIGN_PFX_BASE64 != '' }}
        shell: pwsh
        run: |
          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Filter signtool.exe -Recurse |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1).FullName
          if (-not $signtool) { throw "signtool.exe not found" }
          $release = "build\windows\x64\runner\Release"
          $targets = Get-ChildItem $release -Recurse -File | Where-Object { $_.Extension -in ".exe", ".dll" }
          foreach ($target in $targets) {
            & $signtool sign /fd SHA256 /td SHA256 /tr "http://timestamp.digicert.com" /f $env:ARI_CODESIGN_PFX /p $env:WINDOWS_CODESIGN_PASSWORD $target.FullName
            if ($LASTEXITCODE -ne 0) { throw "Signing failed: $($target.FullName)" }
          }

      - name: Verify application signature
        if: ${{ env.WINDOWS_CODESIGN_PFX_BASE64 != '' }}
        shell: pwsh
        run: |
          $exe = "build\windows\x64\runner\Release\ARI_SMART_RO.exe"
          $signature = Get-AuthenticodeSignature $exe
          Write-Host "ARI_SMART_RO.exe signature status: $($signature.Status)"
          if ($signature.Status -ne "Valid") { throw "Application Authenticode signature is not valid." }

      - name: Smoke test Windows app startup
        shell: pwsh
        run: |
          $exe = Resolve-Path "build\windows\x64\runner\Release\ARI_SMART_RO.exe"
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          if ($process.HasExited) {
            throw "ARI_SMART_RO.exe exited during startup smoke test with code $($process.ExitCode)."
          }
          Stop-Process -Id $process.Id -Force
          Write-Host "ARI_SMART_RO.exe remained running for the startup smoke test."

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Setup.exe installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "Inno Setup compiler not found." }
          & $iscc "installer\ari_smart_ro.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed." }

      - name: Sign Setup.exe installer
        if: ${{ env.WINDOWS_CODESIGN_PFX_BASE64 != '' }}
        shell: pwsh
        run: |
          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Filter signtool.exe -Recurse |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1).FullName
          if (-not $signtool) { throw "signtool.exe not found" }
          $setup = "build\windows\installer\ARI-SMART-RO-Setup-v1.0.33.exe"
          & $signtool sign /fd SHA256 /td SHA256 /tr "http://timestamp.digicert.com" /f $env:ARI_CODESIGN_PFX /p $env:WINDOWS_CODESIGN_PASSWORD $setup
          if ($LASTEXITCODE -ne 0) { throw "Installer signing failed." }
          $signature = Get-AuthenticodeSignature $setup
          Write-Host "Setup signature status: $($signature.Status)"
          if ($signature.Status -ne "Valid") { throw "Installer Authenticode signature is not valid." }

      - name: Prepare portable Windows package
        shell: pwsh
        run: |
          $release = "build\windows\x64\runner\Release"
          if (!(Test-Path "$release\ARI_SMART_RO.exe")) {
            throw "ARI_SMART_RO.exe not found after Windows build."
          }
          $package = "build\windows\ARI-SMART-RO-Windows-v1.0.33"
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Copy-Item "$release\*" $package -Recurse -Force
          Compress-Archive -Path "$package\*" -DestinationPath "build\windows\ARI-SMART-RO-Windows-v1.0.33.zip" -Force

      - name: Write signing status
        shell: pwsh
        run: |
          if ($env:WINDOWS_CODESIGN_PFX_BASE64) {
            "SIGNED_WITH_TRUSTED_CERTIFICATE=true" | Out-File "build\windows\SIGNING_STATUS.txt" -Encoding utf8
          } else {
            "SIGNED_WITH_TRUSTED_CERTIFICATE=false" | Out-File "build\windows\SIGNING_STATUS.txt" -Encoding utf8
            "A trusted code-signing PFX is required to avoid Smart App Control reputation warnings." | Out-File "build\windows\SIGNING_STATUS.txt" -Append -Encoding utf8
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: ARI-SMART-RO-Setup-v1.0.33
          path: |
            ari_smart_ro_app/build/windows/installer/ARI-SMART-RO-Setup-v1.0.33.exe
            ari_smart_ro_app/build/windows/SIGNING_STATUS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload portable Windows app
        uses: actions/upload-artifact@v4
        with:
          name: ARI-SMART-RO-Windows-v1.0.33
          path: ari_smart_ro_app/build/windows/ARI-SMART-RO-Windows-v1.0.33.zip
          if-no-files-found: error
          retention-days: 30
