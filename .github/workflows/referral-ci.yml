name: ARI SMART RO CI

on:
  pull_request:
    branches: [main, andy-assistant, production-launch]
  push:
    branches: [andy-assistant, production-launch]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Django deployment checks
        env:
          DJANGO_DEBUG: "0"
          DJANGO_SECRET_KEY: "ci-only-secret-key-not-used-in-production"
          DJANGO_ALLOWED_HOSTS: "testserver,localhost"
          DJANGO_SECURE_SSL_REDIRECT: "0"
        run: |
          python manage.py check --deploy
          python manage.py makemigrations --check --dry-run
      - name: Backend tests
        run: python manage.py test -v 1

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ari_smart_ro_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
