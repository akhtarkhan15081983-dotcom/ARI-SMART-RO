name: ARI SMART RO CI

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main, andy-assistant, production-launch]
  push:
    branches: [main, andy-assistant, production-launch]

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ari_ci
          POSTGRES_USER: ari_ci
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ari_ci -d ari_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_NAME: ari_ci
      DB_USER: ari_ci
      DB_PASSWORD: ci-only-password
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      ARI_SKIP_EXACT_EXCEL_IMPORT_FOR_TESTS: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Django deployment checks
        env:
          DJANGO_DEBUG: "0"
          DJANGO_SECRET_KEY: "ci-only-secret-key-not-used-in-production"
          DJANGO_ALLOWED_HOSTS: "testserver,localhost"
          DJANGO_SECURE_SSL_REDIRECT: "0"
          DJANGO_MEDIA_STORAGE_BACKEND: "filesystem"
          DJANGO_MEDIA_ROOT: "/tmp/ari-smart-ro-ci-media"
          OTP_SMS_BACKEND: "webhook"
          OTP_SMS_WEBHOOK_URL: "https://example.invalid/otp"
        run: |
          python manage.py check --deploy
          python manage.py makemigrations --check --dry-run
      - name: Backend tests
        env:
          DJANGO_DISABLE_AUTH_THROTTLING: "1"
        run: python manage.py test -v 1 --keepdb

  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ari_smart_ro_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
      - name: Compile Android universal debug APK
        run: >-
          flutter build apk --debug
          --dart-define=API_BASE_URL=https://ari-smart-ro-api.onrender.com/api
      - name: Prepare universal APK
        run: |
          mkdir -p build/share
          cp build/app/outputs/flutter-apk/app-debug.apk build/share/ARI-SMART-RO-v1.0.31-UNIVERSAL.apk
      - name: Compile Android split APKs
        run: >-
          flutter build apk --debug --split-per-abi
          --dart-define=API_BASE_URL=https://ari-smart-ro-api.onrender.com/api
      - name: Prepare phone-specific APKs
        run: |
          cp build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk build/share/ARI-SMART-RO-v1.0.31-ARM64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-debug.apk build/share/ARI-SMART-RO-v1.0.31-ARMv7.apk
          cp build/app/outputs/flutter-apk/app-x86_64-debug.apk build/share/ARI-SMART-RO-v1.0.31-x86_64.apk
          cd build/share
          sha256sum *.apk > SHA256SUMS.txt
      - name: Upload Android APK family
        uses: actions/upload-artifact@v4
        with:
          name: ARI-SMART-RO-Mobile-v1.0.31-All-Phones
          path: ari_smart_ro_app/build/share/*
          if-no-files-found: error
          retention-days: 30

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build production container
        run: docker build -t ari-smart-ro:${{ github.sha }} .


  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ari_smart_ro_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Build Windows release
        run: >-
          flutter build windows --release
          --dart-define=API_BASE_URL=https://ari-smart-ro-api.onrender.com/api
      - name: Verify Windows Safe Build
        shell: pwsh
        run: |
          $release = "build\windows\x64\runner\Release"
          $blockedPatterns = @(
            "*file_selector*",
            "*flutter_secure_storage*",
            "*geolocator*",
            "*permission_handler*",
            "*record_windows*",
            "*url_launcher*",
            "*local_notifications*",
            "dartjni.dll"
          )
          foreach ($pattern in $blockedPatterns) {
            $found = Get-ChildItem $release -Filter $pattern -ErrorAction SilentlyContinue
            if ($found) {
              throw "Unsafe native plugin present in Windows Safe Build: $($found.Name -join ', ')"
            }
          }
          Write-Host "Windows Safe Build contains no third-party plugin DLLs."

      - name: Smoke test Windows app startup
        shell: pwsh
        run: |
          $exe = Resolve-Path "build\windows\x64\runner\Release\ARI_SMART_RO.exe"
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          if ($process.HasExited) {
            throw "ARI_SMART_RO.exe exited during startup smoke test with code $($process.ExitCode)."
          }
          Stop-Process -Id $process.Id -Force
          Write-Host "ARI_SMART_RO.exe remained running for the startup smoke test."

      - name: Prepare Windows package
        shell: pwsh
        run: |
          $release = "build\windows\x64\runner\Release"
          if (!(Test-Path "$release\ARI_SMART_RO.exe")) {
            throw "ARI_SMART_RO.exe not found after Windows build."
          }
          $package = "build\windows\ARI-SMART-RO-Windows-v1.0.32"
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Copy-Item "$release\*" $package -Recurse -Force
          Compress-Archive -Path "$package\*" -DestinationPath "build\windows\ARI-SMART-RO-Windows-v1.0.32.zip" -Force
      - name: Upload Windows desktop app
        uses: actions/upload-artifact@v4
        with:
          name: ARI-SMART-RO-Windows-v1.0.32
          path: ari_smart_ro_app/build/windows/ARI-SMART-RO-Windows-v1.0.32.zip
          if-no-files-found: error
          retention-days: 30
